name: release
# Push a tag like v0.3.0-beta.1: builds and packs the SDK on GitHub and attaches the .tgz to a GitHub release.
# Apps (Kairmel) install it from the release URL, so no npm token is needed.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run test:contracts
      - run: npm run build
      - run: npm run test:pack-install
      - name: Pack
        run: echo "TGZ=$(npm pack --silent)" >> "$GITHUB_ENV"
      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" "$TGZ" $pre --title "@yaatal-labs/client ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md. Install: npm i https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/${TGZ}"
